repos:
  - repo: local
    hooks:
      - id: vcw-stress-commit-ok
        name: vcw stress pre-commit (always passes)
        entry: "true"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: vcw-stress-push-fail
        name: vcw stress pre-push (always fails)
        entry: sh -c 'echo "VCW-STRESS-PREPUSH-FAIL tool vcw-lint not found"; exit 1'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
